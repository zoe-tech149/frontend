<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text Decoration</title>

    <style>

      a {
        text-decoration: none;
      }

      .underline {
        text-decoration: underline;
      }
      div {
        text-decoration: line-through;
      }

    </style>

  </head>

  <body>

    <p class="underline">This is a paragraph with a 
      <a href="#">link</a>.
    </p>

    <div class="strike">
      This is a division.
    </div>

  </body>

</html>
