<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Font Weight</title>

    <style>
      
      .light-text {
        font-weight: 300;
      }
      .medium-text {
        font-weight: normal;
      }
      .heavy-text {
        font-weight: bold;
      }

    </style>

  </head>

  <body>

    <p class="light-text">This text demonstrates font-weight: 300</p>

    <p class="medium-text">This text demonstrates font-weight: normal</p>

    <p class="heavy-text">This text demonstrates font-weight: bold</p>
   
  </body>

</html>
