<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Blog</title>

    <style>

      h1 {
        color: black;
        font-family: 'Times New Roman', Times, serif;
        font-size: 48px;
        font-weight: bold;
        text-align: center;
      }

      p {
        color: gray;
        font-size: 18px;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }

      a {
        color: red;
        text-decoration: none;
      }
      
      li {
        color: green;
        font-family: 'Courier New', Courier, monospace;
        font-size: 25px;
        font-weight: 600;
      }

    </style>

  </head>

  <body>

    <h1>This is a heading</h1>

    <p>
      This is a paragraph with a <a href="#">link</a>.
    </p>

    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>

  </body>

</html>
