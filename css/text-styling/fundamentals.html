<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text Alignment</title>

    <style>

      h1 {
        text-align: center;
      }
      p {
        text-align: right;
      }
      div {
        text-align: left;
      }

    </style>

  </head>

  <body>

    <h1>This is a heading. </h1>

    <p>This is a paragraph.</p>

    <div>This is a division. </div>
   
  </body>

</html>
