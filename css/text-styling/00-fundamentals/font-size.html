<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Font Size Units</title>

    <style>
      .pixels {
        font-size: 18px;
      }
      .ems {
        font-size: 1.5em;
      }
      .percentage {
        font-size: 90%;
      }
    </style>

  </head>

  <body>

    <div class="parent">
      <p class="pixels">This text is 18px</p>
      <p class="ems">This text is 1.5em</p>
      <p class="percentage">This text is 90%</p>
    </div>
    
  </body>

</html>
