<!DOCTYPE html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Store</title>

    <style>
      h1 {
        color: purple;
      }
      .description {

      <li class="new-release">The Midnight Library</li>
    </ul>

  </body>

</html>
