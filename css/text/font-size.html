<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Font Size</title>

    <style>
      h1 {
        font-size: 40px;
      }
      p {
        font-size: 1.2em;
      }
      div {
        font-size: 120%;
      }
    </style>

  </head>

  <body>

    <h1>This is a heading.</h1>

    <p>This is a paragraph.</p>

    <div>This is a division.</div>
    
  </body>

</html>
