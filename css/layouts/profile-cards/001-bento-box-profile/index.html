<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bento-box Profile</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="profile-card">
      <section class="hero">
        <div class="avatar">
          <span>ZS</span>
        </div>

        <h1 class="name">Zoe Sunflower</h1>

        <p>Product Designer</p>

        <p class="availability"><span class="green-dot"></span>Available</p>
      </section>

      <section class="bio">
        <h2>A B O U T</h2>

        <p>
          Designing calm interfaces for complex data. Ex- Figma, now building
          tools for makers.
        </p>
      </section>

      <div class="projects">
        <p class="project-number">
          <strong>128</strong>
        </p>

        <p>Projects</p>
      </div>

      <div class="ratings">
        <p class="rating-score">
          <strong>4.9</strong>
        </p>

        <p>Rating</p>
      </div>

      <section class="skill-tags">
        <h2>S T A C K</h2>

        <ul class="skills">
          <li class="figma">Figma</li>
          <li class="oklch">OKLCH</li>
          <li class="motion">Motion</li>
          <li class="rust">Rust</li>
        </ul>
      </section>

      <section class="local-time">
        <h2>L O C A L</h2>

        <p>
          <strong>09:41</strong>
        </p>

        <p>Lisbon • GMT</p>
      </section>

      <div class="interacts-buttons">
        <button type="button" class="followBtn">Follow</button>

        <button type="button" class="messageBtn">Message</button>
      </div>
    </main>
  </body>
</html>
