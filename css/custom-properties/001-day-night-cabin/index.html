<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Day &amp; Night Cabin</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <header>
        <h1>Day &amp; Night Cabin</h1>

        <input
          class="switch"
          type="checkbox"
          id="night"
          aria-label="Toggle night"
        />
      </header>

      <figure
        class="scene"
        role="img"
        aria-label="A cabin on a hill, shown in day or night"
      >
        <div class="stars"></div>
        <div class="orb"></div>
        <div class="hill back"></div>
        <div class="hill front"></div>

        <div class="cabin">
          <div class="chimney"></div>
          <div class="roof"></div>
          <div class="door"></div>
          <div class="win"></div>
        </div>
      </figure>
    </main>
  </body>
</html>
