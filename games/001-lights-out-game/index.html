<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lights Out</title>

    <link rel="stylesheet" href="style.css">

  </head>

  <body>

    <main class="game-container">

      <h1 class="game-title">Lights Out</h1>

      <p>Click a tile to toggle it and its neighbors. Turn every light off to win.</p>

      <section class="game-stats">

        <div class="moves">

          <p>Moves</p>

          <span id="player-moves">0</span>
          
        </div>

        <div class="score">
      
          <p>Best Score</p>
            
          <span id="best-score">--</span>

        </div>
 
      </section>

      <section id="game-board">

      </section>

      <section class="game-status" aria-live="polite">

        <p id="status"></p>
 
      </section>

      <section class="game-controls">

        <button type="button" class="reset-puzzle">
          Reset puzzle
        </button>

        <button type="button" class="new-puzzle">
          New puzzle
        </button>

      </section>

    </main>

    <script src="script.js" defer></script>
    
  </body>

</html>
